name: Generate reviewed web dependency lock
on:
  pull_request:
    branches: ['foundation/sprint-01']
    paths: ['.github/workflows/dependency-lock-review.yml']
permissions:
  contents: read
jobs:
  lock-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve security patches without lifecycle scripts
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund next@^16.3.6 eslint-config-next@^16.3.6
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Export only public package manifests for controller review
        working-directory: apps/web
        run: |
          node -e 'const fs=require("node:fs"); for(const file of ["package.json","package-lock.json"]) { const data=fs.readFileSync(file,"utf8"); console.log("SM_MANIFEST_BEGIN "+file); for(const line of data.split("\n")) console.log("SM_MANIFEST_LINE "+line); console.log("SM_MANIFEST_END "+file); }'
