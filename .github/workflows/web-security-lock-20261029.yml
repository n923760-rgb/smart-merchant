name: One-time audited web lockfile refresh
on:
  push:
    branches: [fix/web-security-lock-20261029]
    paths:
      - .github/workflows/web-security-lock-20261029.yml
permissions:
  contents: write
jobs:
  lockfile-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched dependencies without running install scripts
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Verify web application on updated lockfile
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Confirm bounded diff and remove one-time workflow
        run: |
          git diff --exit-code -- apps/web/package.json
          git diff --name-only
          git add apps/web/package-lock.json
          git rm .github/workflows/web-security-lock-20261029.yml
          git diff --cached --name-only
          git diff --cached --quiet && { echo "No dependency updates generated"; exit 1; } || :
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(web): refresh vulnerable locked dependencies after security audit"
      - name: Push only the reviewed output to this dedicated branch
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          header="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $header" \
            push "https://github.com/$GITHUB_REPOSITORY.git" \
            HEAD:refs/heads/fix/web-security-lock-20261029
