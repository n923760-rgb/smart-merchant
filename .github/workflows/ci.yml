name: Foundation CI
permissions:
  contents: read
  pull-requests: read
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: merchant, POSTGRES_PASSWORD: merchant, POSTGRES_DB: smart_merchant_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U merchant -d smart_merchant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run: { working-directory: backend }
    env:
      DATABASE_URL: postgresql+psycopg://merchant:merchant@localhost:5432/smart_merchant_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-disposable-unique-testing-secret-not-for-production
      BOOTSTRAP_KEY: test-bootstrap-key-for-disposable-test-db-000000
      APP_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
      - run: alembic downgrade base && alembic upgrade head
  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm audit --audit-level=high
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { app: [pos, owner] }
    defaults:
      run: { working-directory: 'apps/${{ matrix.app }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
