name: Governance CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Validate project governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Check governance Python syntax
        run: python -m compileall -q governance/tools
      - name: Validate contracts and fail-closed packet fixtures
        run: python governance/tools/check-adoption.py
      - name: Record exact inspected source
        run: git rev-parse HEAD
